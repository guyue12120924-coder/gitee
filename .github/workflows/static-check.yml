name: Static Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static audit
        run: node scripts/static-check.mjs
      - name: Run responsive browser smoke
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          node scripts/browser-smoke.mjs
